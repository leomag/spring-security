name: CI-Pipeline


on: 
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main
      - feature/*
    types: [opened, synchronize, reopened, closed] 

permissions:
  checks: write
  contents: read
  pull-requests: write


jobs:
  lint:
    name: Run Checkstyle
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: ["25"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Gradle Checkstyle
        run: gradle checkstyleMain checkstyleTest

      - name: Publish Checkstyle Report
        uses: lcollins/checkstyle-github-action@v3.2.0
        with:
          path: '**/*.xml'
        if: always()

  test:
    needs: [lint]
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: ["25"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Gradle Test
        run: gradle test

      - name: Upload HTML Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-html
          path: |
            build/reports/tests/test/

      - name: Publish JUnit Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Gradle Tests
          path: build/test-results/test/*.xml
          reporter: java-junit
