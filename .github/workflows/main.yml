name: CI-Pipeline


on: 
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main
      - feature/*
    types: [opened, synchronize, reopened, closed] 

permissions:
  checks: write
  contents: read
  pull-requests: write


jobs:
  lint:
    name: Run Checkstyle
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: ["25"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Gradle Checkstyle
        run: gradle checkstyleMain

      - name: Publish Checkstyle Report
        uses: lcollins/checkstyle-github-action@v3.2.0
        with:
          path: '**/main.xml'   
  test:
    name: Run Checkstyle
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: ["25"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Gradle Test
        run: gradle test

      - name: Publish Test Report
        uses: actions/upload-artifact@v4
        with:
          path: '***/index.html'             
