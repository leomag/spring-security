version: '3.9'

services:
  app:
    image: ghcr.io/leomag/spring-security.8e90a983b0fe870a3cc3d2e0a747ef74d749082b:sha256-48d9ded5f66601055cd582a32e380b98b6c688b3e4574682f1f7ec3acee8788f
    platform: linux/amd64
    container_name: app_security_container
    ports:
      - ${APP_PORT}:8888
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:${POSTGRES_PORT}/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_JPA_GENERATE_DDL=false
      - JWT_SECRET=${JWT_SECRET}
      - JWT_LIFETIME=${JWT_LIFETIME}
    depends_on:
      db:
        condition: service_healthy  
      flyway:
        condition: service_started   

  db:
    image: postgres:18
    restart: always
    container_name: postgres_db_container
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: "/var/lib/postgresql/data/pgdata"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./database:/docker-entrypoint-initdb.d.ro
      - data-security:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT}:5432

  flyway:
    image: flyway/flyway:12.6.1
    container_name: flyway_container
    command: migrate
    volumes:
      - ./sql:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://db:${POSTGRES_PORT}/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:./sql
    depends_on:
      db:
        condition: service_healthy  

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG_ADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PG_ADMIN_PASSWORD}
    ports:
      - ${PG_PORT}:80
    depends_on:
      db:
        condition: service_healthy

volumes:
  data-security: